openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Manages a signed-in user's private todos.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    TodoId:
      name: todoId
      in: path
      required: true
      description: todo identifier
      schema: { type: string }
  schemas:
    Todo:
      type: object
      required: [id, text, completed, createdAt]
      properties:
        id: { type: string, description: todo identifier }
        text: { type: string, description: what needs to be done }
        completed: { type: boolean, description: whether the todo is done }
        createdAt: { type: string, format: date-time, description: creation timestamp }
    NewTodo:
      type: object
      required: [text]
      properties:
        text: { type: string, description: what needs to be done }
    TodoList:
      type: object
      required: [count, data]
      properties:
        count: { type: integer, description: total matching todos }
        next: { type: string, nullable: true, description: relative URI of the next page }
        previous: { type: string, nullable: true, description: relative URI of the previous page }
        data:
          type: array
          items: { $ref: '#/components/schemas/Todo' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - bearerAuth: []
paths:
  /todos:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listTodos
      summary: List the caller's own todos
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: completed
          in: query
          description: filter by completion state
          schema: { type: boolean }
      responses:
        '200':
          description: matching todos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createTodo
      summary: Create a new todo for the caller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTodo' }
      responses:
        '201':
          description: todo created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400':
          description: invalid todo payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /todos/{todoId}/complete:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/TodoId'
    patch:
      operationId: completeTodo
      summary: Mark the caller's own todo as complete
      responses:
        '200':
          description: todo marked complete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: todo not found or not owned by caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
